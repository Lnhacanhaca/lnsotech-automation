name: LNSOTECH Deploy & Backup

on:
  workflow_dispatch: # Permite disparar manualmente se necessário

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/apps/bot/lnsotech-automation
            git pull origin main
            
            # Subir os serviços usando as melhores práticas (Produção)
            # O build acontece dentro do docker agora!
            docker compose up -d --build
            
            echo "✅ Deploy concluído com sucesso!"

  backup:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: deploy
    steps:
      - name: Backup Database via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            BACKUP_DIR="/opt/apps/bot/backups"
            mkdir -p $BACKUP_DIR
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            
            # Backup PostgreSQL (Nome do contentor atualizado para lnsotech-db)
            docker exec lnsotech-db pg_dump -U lnso_admin lnsotech_db > "$BACKUP_DIR/db_backup_$TIMESTAMP.sql"
            
            # Manter apenas os últimos 10 backups
            ls -t $BACKUP_DIR/db_backup_*.sql | tail -n +11 | xargs -r rm
            
            echo "✅ Backup concluído: db_backup_$TIMESTAMP.sql"
