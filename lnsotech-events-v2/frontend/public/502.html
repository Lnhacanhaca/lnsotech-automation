<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KUMBUKA - Conexão Interrompida</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.5);
            --secondary: #a855f7;
            --bg: #020617;
            --glass: rgba(15, 23, 42, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            perspective: 1000px;
        }

        /* Fundo Animado de Estrelas/Partículas */
        .stars-container {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: radial-gradient(circle at center, #1e1b4b 0%, #020617 100%);
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.3;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: 0.3;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        /* Cartão Glassmorphism */
        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 4rem 3rem;
            max-width: 550px;
            width: 90%;
            text-align: center;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Moldura de Gradiente Animado */
        .glass-card::before {
            content: '';
            position: absolute;
            inset: -2px;
            background: linear-gradient(45deg, var(--primary), var(--secondary), var(--primary));
            background-size: 200% 200%;
            z-index: -1;
            border-radius: 34px;
            animation: gradientBorder 4s linear infinite;
            opacity: 0.3;
        }

        @keyframes gradientBorder {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px) rotateX(-10deg);
            }

            to {
                opacity: 1;
                transform: translateY(0) rotateX(0);
            }
        }

        /* Ícone 3D Animado */
        .icon-wrapper {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 2.5rem;
        }

        .orb {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 30% 30%, var(--primary), var(--secondary));
            border-radius: 50%;
            filter: blur(20px);
            opacity: 0.4;
            animation: orbFloat 3s infinite ease-in-out;
        }

        .main-icon {
            position: relative;
            font-size: 5rem;
            z-index: 2;
            filter: drop-shadow(0 0 20px var(--primary-glow));
            animation: float 4s infinite ease-in-out;
        }

        @keyframes orbFloat {

            0%,
            100% {
                transform: scale(1) translate(0, 0);
            }

            50% {
                transform: scale(1.2) translate(10px, -10px);
            }
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15px);
            }
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 800;
            margin-bottom: 1rem;
            letter-spacing: -1px;
            background: linear-gradient(to bottom, #fff 30%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.15rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 3rem;
        }

        /* Botão Futurista */
        .btn-refresh {
            position: relative;
            padding: 1.2rem 3rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px -10px var(--primary);
        }

        .btn-refresh:hover {
            transform: scale(1.05) translateY(-3px);
            box-shadow: 0 20px 40px -10px var(--primary);
            background: var(--primary-dark);
        }

        .btn-refresh::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transform: rotate(45deg);
            transition: 0.5s;
            pointer-events: none;
        }

        .btn-refresh:hover::after {
            left: 120%;
        }

        /* Status Pill */
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            padding: 0.5rem 1.2rem;
            border-radius: 100px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 2rem;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #ef4444;
            border-radius: 50%;
            box-shadow: 0 0 10px #ef4444;
            animation: blink 1s infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        .footer {
            margin-top: 3rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            opacity: 0.6;
        }
    </style>
</head>

<body>
    <div class="stars-container" id="stars"></div>

    <div class="glass-card">
        <div class="status-pill">
            <div class="dot"></div>
            Sistema em Manutenção
        </div>

        <div class="icon-wrapper">
            <div class="orb"></div>
            <div class="main-icon">🛸</div>
        </div>

        <h1>Ops! Conexão Perdida</h1>
        <p>Parece que o motor do <strong>KUMBUKA</strong> entrou em hiperespaço por um momento. A nossa equipa de
            engenheiros já está a estabilizar a conexão.</p>

        <button class="btn-refresh" onclick="window.location.reload()">
            RECONECTAR AGORA
        </button>

        <div class="footer">
            DOCKER_CONTAINER: UPSTREAM_502_ERROR | REF: <span id="ref-id"></span>
        </div>
    </div>

    <script>
        // Gerar estrelas aleatórias
        const container = document.getElementById('stars');
        for (let i = 0; i < 150; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = `${Math.random() * 100}%`;
            star.style.top = `${Math.random() * 100}%`;
            const size = Math.random() * 3 + 1;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.setProperty('--duration', `${Math.random() * 3 + 2}s`);
            container.appendChild(star);
        }

        // Ref ID Aleatório
        document.getElementById('ref-id').innerText = Math.random().toString(36).substring(2, 10).toUpperCase();
    </script>
</body>

</html>
