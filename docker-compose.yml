services:
  database:
    image: postgres:17-alpine
    container_name: lnsotech-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - ./postgres_data_v2:/var/lib/postgresql/data
      - ./postgres/v2_update.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_network

  bot:
    build: 
      context: ./lnsotech-events-v2/backend
      dockerfile: Dockerfile
    container_name: lnsotech-backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    env_file: .env
    volumes:
      - ./auth_info_baileys:/app/auth_info_baileys
      - ./uploads:/app/uploads
    networks:
      - backend_network

  frontend:
    build:
      context: ./lnsotech-events-v2/frontend
      dockerfile: Dockerfile
    container_name: lnsotech-frontend
    restart: unless-stopped
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./uploads:/usr/share/nginx/html/uploads:ro
    ports:
      - "3001:80"
    depends_on:
      - bot
    networks:
      - backend_network

networks:
  backend_network:
    driver: bridge